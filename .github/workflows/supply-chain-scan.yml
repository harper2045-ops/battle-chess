name: Supply Chain Threat Scan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '**/Dockerfile'
      - '.github/workflows/**'
      - '**/*.yml'
      - '**/*.yaml'
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.26.0
        with:
          scan-type: 'fs'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: false
          # Additional config for ecosystems
          vuln-type: 'os,library'

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Parse Trivy output for alerts
        id: parse
        run: |
          # Capture raw text output from trivy stdout
          TRIVY_OUTPUT=$(trivy fs --scanners vuln --severity HIGH,CRITICAL --format json . 2>/dev/null || true)
          echo "trivy_output<<EOF" >> $GITHUB_OUTPUT
          echo "$TRIVY_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create comment on Pull Request
        if: github.event_name == 'pull_request' && steps.parse.outputs.trivy_output != 'null' && steps.parse.outputs.trivy_output != ''
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.parse.outputs.trivy_output }}`;
            let vulns = [];
            try {
              const data = JSON.parse(output);
              vulns = data.Results?.flatMap(r => 
                r.Vulnerabilities?.map(v => ({
                  pkg: r.Target || 'unknown',
                  id: v.VulnerabilityID,
                  severity: v.Severity,
                  title: v.Title || v.VulnerabilityID,
                  description: v.Description?.substring(0, 200) + '...',
                  fixedVersion: v.FixedVersion || 'N/A',
                })) || []
              ).filter(Boolean) || [];
            } catch (e) {
              console.log('Failed to parse trivy output', e);
            }

            if (vulns.length === 0) {
              console.log('No high/critical vulnerabilities found.');
              return;
            }

            let comment = `### 🔍 Supply Chain Threat Scan\n`;
            comment += `**${vulns.length} High/Critical vulnerability(ies) detected**\n\n`;
            comment += `| Package | Vulnerability | Severity | Fixed Version |\n`;
            comment += `|---------|---------------|----------|---------------|\n`;
            vulns.forEach(v => {
              comment += `| ${v.pkg} | ${v.id} | ${v.severity} | ${v.fixedVersion} |\n`;
            });
            comment += `\nPlease review and consider updating dependencies.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

      - name: Create GitHub Issue for scheduled scan
        if: github.event_name == 'schedule' && steps.parse.outputs.trivy_output != 'null' && steps.parse.outputs.trivy_output != ''
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.parse.outputs.trivy_output }}`;
            let vulns = [];
            try {
              const data = JSON.parse(output);
              vulns = data.Results?.flatMap(r => 
                r.Vulnerabilities?.map(v => ({
                  pkg: r.Target || 'unknown',
                  id: v.VulnerabilityID,
                  severity: v.Severity,
                  title: v.Title || v.VulnerabilityID,
                  description: v.Description?.substring(0,2147483647),
                  fixedVersion: v.FixedVersion || 'N/A',
                })) || []
              ).filter(Boolean) || [];
            } catch (e) {
              console.log('Failed to parse trivy output', e);
            }

            if (vulns.length === 0) {
              console.log('No high/critical vulnerabilities found.');
              return;
            }

            const title = `Supply Chain Alert: ${vulns.length} High/Critical vulnerabilities detected`;
            let body = `## Supply Chain Threat Scan - Daily Report\n`;
            body += `**Repository:** ${context.repo.owner}/${context.repo.repo}\n`;
            body += `**Scan Date:** ${new Date().toISOString().split('T')[0]}\n`;
            body += `**Total Findings:** ${vulns.length}\n\n`;
            body += `### Vulnerabilities\n`;
            body += `| Package | Vulnerability | Severity | Fixed Version |\n`;
            body += `|---------|---------------|----------|---------------|\n`;
            vulns.forEach(v => {
              body += `| ${v.pkg} | ${v.id} | ${v.severity} | ${v.fixedVersion} |\n`;
            });
            body += `\nPlease review and consider updating dependencies.`;

            // Check if an open issue with similar title exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'supply-chain',
            });

            const existing = issues.data.find(i => i.title.includes('Supply Chain Alert'));
            if (existing) {
              console.log('Updating existing issue #' + existing.number);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['supply-chain'],
              });
            }